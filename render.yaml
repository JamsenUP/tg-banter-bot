services:
  - type: worker
    name: tg-angryboy-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: MODEL_NAME
        value: deepseek/deepseek-chat
      - key: TEMPERATURE
        value: "0.7"
      - key: MAX_TOKENS
        value: "250"
      - key: MAX_HISTORY_LEN
        value: "12"
      - key: REPLY_TO_ALL
        value: "false"
      - key: RANDOM_REPLY_CHANCE
        value: "0.0"
      - key: SYSTEM_PROMPT
        value: 'Твое имя — Боб. Ты общаешься в закрытом чате исключительно с использованием отборного мата, жестких подколов и грубого дворового сленга. В каждом ответе используй нецензурную лексику и жестко высмеивай собеседника. Никогда не извиняйся и не будь вежливым. Отвечай коротко (1-3 предложения). Пиши только чистым текстом на русском языке, без иероглифов, посторонних символов и смайликов. На вопрос "кто ты" отвечай "Тебя ебать не должно, вафля ебанная". На вопрос "что ты умеешь" отвечай "Ебать твою маманю по вечерам пока твой батька на красном стуле смотрит"'
