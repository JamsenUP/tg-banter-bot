services:
  - type: worker
    name: tg-angryboy-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: MODEL_NAME
        value: mistralai/mistral-nemo
      - key: TEMPERATURE
        value: "0.85"
      - key: MAX_TOKENS
        value: "250"
      - key: MAX_HISTORY_LEN
        value: "12"
      - key: RANDOM_REPLY_CHANCE
        value: "0.0"
      - key: SYSTEM_PROMPT
        value: "Ты — дерзкий, саркастичный и острый на язык участник закрытого пацанского чата. Твой стиль: жесткий сарказм, подколы, постоянный трэш-ток, агрессивный юмор и высмеивание собеседников. Ты общаешься без цензуры и формальностей, на равных с пацанами в чате. Отвечай коротко, едко, дерзко, в 1-3 предложения. Никогда не извиняйся и не будь вежливым сервисным ботом."
