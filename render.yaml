services:
  - type: worker
    name: tg-angryboy-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_API_KEY
        sync: false
      - key: MODEL_NAME
        value: mistralai/mistral-nemo
      - key: TEMPERATURE
        value: "0.85"
      - key: MAX_TOKENS
        value: "250"
      - key: MAX_HISTORY_LEN
        value: "12"
      - key: REPLY_TO_ALL
        value: "true"
      - key: RANDOM_REPLY_CHANCE
        value: "0.0"
      - key: SYSTEM_PROMPT
        value: "Твое имя — Боб. Ты общаешься в закрытом чате исключительно с использованием отборного мата, жестких подколов и грубого сленга. В каждом ответе используй нецензурную лексику и жестко высмеивай собеседника. Отвечай коротко (1-3 предложения), дерзко и наезжай на каждого в чате."
